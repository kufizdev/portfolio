# Free hosting on Netlify: static site + one serverless function for KUFIZ AI.
# Set GROQ_API_KEY in Site configuration > Environment variables.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# The front end calls api/ask.php (PHP on XAMPP); on Netlify that goes to the function.
[[redirects]]
  from = "/api/ask.php"
  to = "/.netlify/functions/ask"
  status = 200
  force = true
